name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
      - name: Buat folder android jika belum ada
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name dtx_kendang --org com.nabze .
          fi
      - name: Paksa compileSdk 36 untuk semua plugin (cadangan)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/force-compilesdk.gradle <<'GRADLE'
          gradle.afterProject { p ->
            if (p.plugins.hasPlugin('com.android.library')) {
              p.extensions.getByName('android').compileSdkVersion(36)
            }
          }
          GRADLE
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: dtx-kendang-apk
          path: build/app/outputs/flutter-apk/app-release.apk
